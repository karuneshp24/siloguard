<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>SiloGuard — Master Unified Agritech Platform</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:#060a12;color:#e2e8f0;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px}
button{cursor:pointer;font-family:inherit;border:none}

/* ── Master Navigation Bar ─────────────────────────────────────────── */
.master-header{
  height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 1rem;background:rgba(9,13,22,.96);border-bottom:1px solid rgba(52,211,153,.25);
  box-shadow:0 4px 24px rgba(0,0,0,.7);position:relative;z-index:100;backdrop-filter:blur(16px);
}
.brand{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.brand-icon{
  width:34px;height:34px;border-radius:.5rem;background:rgba(16,185,129,.15);border:1.5px solid #34d399;
  display:flex;align-items:center;justify-content:center;color:#34d399;box-shadow:0 0 12px rgba(52,211,153,.4);
}
.brand-title{font-size:1.05rem;font-weight:900;color:#f8fafc;letter-spacing:.02em}

/* ── 40% vs 60% vs 3D Silo Segmented Switcher ─────────────────────── */
.mode-switcher{
  display:inline-flex;align-items:center;background:rgba(2,6,23,.9);
  padding:3px;border-radius:.65rem;border:1px solid #334155;gap:3px;
}
.mode-tab{
  display:inline-flex;align-items:center;gap:.45rem;padding:.4rem .85rem;border-radius:.5rem;
  font-size:.7rem;font-weight:700;color:#94a3b8;transition:all .2s;white-space:nowrap;
}
.mode-tab:hover{color:#f8fafc;background:rgba(51,65,85,.4)}
.mode-tab.active-60{
  background:#34d399;color:#060a12;font-weight:900;box-shadow:0 0 16px rgba(52,211,153,.6);
}
.mode-tab.active-40{
  background:#06b6d4;color:#021118;font-weight:900;box-shadow:0 0 16px rgba(6,182,212,.7);
}
.mode-tab.active-silo{
  background:#a78bfa;color:#021118;font-weight:900;box-shadow:0 0 16px rgba(167,139,250,.7);
}

.header-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.action-link{
  display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .65rem;border-radius:.45rem;
  background:rgba(15,23,42,.8);border:1px solid rgba(51,65,85,.6);color:#94a3b8;font-size:.65rem;
  font-weight:700;text-decoration:none;transition:all .2s;
}
.action-link:hover{background:rgba(52,211,153,.15);color:#34d399;border-color:#34d399}

/* ── Seamless Full-Screen Frame Viewports ──────────────────────────── */
.viewport-container{
  width:100%;height:calc(100vh - 56px);position:relative;background:#050811;
}
.app-frame{
  width:100%;height:100%;border:none;display:none;
}
.app-frame.active{
  display:block;
}
</style>
</head>
<body>

<!-- ── MASTER HEADER WITH OPTION SWITCHER ── -->
<header class="master-header">
  <div class="brand">
    <div class="brand-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <span class="brand-title">SiloGuard Master</span>
  </div>

  <!-- 🎯 THE 3 MASTER OPTIONS (60% vs 40% vs 3D Virtual Silo) -->
  <div class="mode-switcher">
    <button class="mode-tab active-60" id="tab-60" onclick="switchApp('frame-60', 'active-60', this)">
      <span>🌾</span>
      <span>60% Grain Silo Twin</span>
    </button>
    <button class="mode-tab" id="tab-40" onclick="switchApp('frame-40', 'active-40', this)">
      <span>⚡</span>
      <span>40% Biofuel Facility</span>
    </button>
    <button class="mode-tab" id="tab-silo" onclick="switchApp('frame-silo', 'active-silo', this)">
      <span>🏛️</span>
      <span>3D Virtual Silo Table</span>
    </button>
  </div>

  <!-- Actions -->
  <div class="header-right">
    <button class="action-link" onclick="reloadActiveFrame()" title="Reload Active App">
      <span>🔄</span>
      <span>Reload</span>
    </button>
    <a id="popoutLink" href="SiloGuard.html" target="_blank" class="action-link" title="Open active module in new tab">
      <span>↗️</span>
      <span>Full View</span>
    </a>
  </div>
</header>

<!-- ── 3 DEDICATED SEAMLESS VIEWPORTS ── -->
<div class="viewport-container">
  <!-- 🌾 60% Core Grain Silo Digital Twin -->
  <iframe id="frame-60" class="app-frame active" src="SiloGuard.html" title="60% Grain Silo Digital Twin"></iframe>

  <!-- ⚡ 40% Biofuel & Clean Energy Facility -->
  <iframe id="frame-40" class="app-frame" src="biofuel_recovery.html" title="40% Biofuel Power Plant"></iframe>

  <!-- 🏛️ 3D Virtual Silo Split-Screen Telemetry Table -->
  <iframe id="frame-silo" class="app-frame" src="virtual_silo.html" title="3D Virtual Silo Table"></iframe>
</div>

<script>
'use strict';
var currentFrameId = 'frame-60';

var URL_MAP = {
  'frame-60': 'SiloGuard.html',
  'frame-40': 'biofuel_recovery.html',
  'frame-silo': 'virtual_silo.html'
};

function switchApp(frameId, activeClass, btn) {
  currentFrameId = frameId;

  // Hide all frames, show selected
  document.querySelectorAll('.app-frame').forEach(function(f){ f.classList.remove('active'); });
  var frame = document.getElementById(frameId);
  if (frame) frame.classList.add('active');

  // Update tabs
  document.querySelectorAll('.mode-tab').forEach(function(b){
    b.classList.remove('active-60', 'active-40', 'active-silo');
  });
  if (btn) btn.classList.add(activeClass);

  // Update popout link
  var popout = document.getElementById('popoutLink');
  if (popout && URL_MAP[frameId]) popout.href = URL_MAP[frameId];
}

function reloadActiveFrame() {
  var frame = document.getElementById(currentFrameId);
  if (frame) frame.src = frame.src;
}
</script>
</body>
</html>
